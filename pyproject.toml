[project]
name = "halloween-prize-game"
version = "0.1.0"
description = "Raspberry Pi 5 powered prize game to hand out halloween candy"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pygame",
    # GPIO on the Pi only; it does not build on a Mac.
    "rpi-lgpio; sys_platform == 'linux'",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[project.scripts]
halloween-game = "game:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
